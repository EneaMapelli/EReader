name: EReader Windows portable user build

# MANUAL ONLY. The user explicitly requested that no GitHub Actions
# minutes are consumed by routine source commits. Do not add push, pull_request,
# schedule, workflow_run or other automatic triggers without their approval.
# Start via GitHub Actions > EReader Windows portable user build > Run workflow
# ONLY after the user requests a new Windows executable.
on:
  workflow_dispatch:

# A private GitHub prerelease is written only AFTER a verified Windows
# build succeeds. No merge or source-code changes are made to main.
permissions:
  contents: write

concurrency:
  group: ereader-windows-user-build
  cancel-in-progress: false

jobs:
  portable-windows:
    name: Windows x64 Release ZIP (no automated tests)
    # Pin VS 2022. windows-latest currently ships VS 2026/MSVC 14.51,
    # whose STL rejects <experimental/coroutine> in just_audio_windows.
    # Keep the native audio plugin build compatible without patching
    # code inside dependencies downloaded from Pub.
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - name: Checkout current development branch
        uses: actions/checkout@v4
        with:
          ref: feature/m0-flutter-foundation
          persist-credentials: false
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate and compile portable Windows Release
        shell: pwsh
        run: |
          & ./tool/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload full portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EReader-Windows-x64-portable
          path: .local-windows-build/releases/EReader-Windows-x64-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish downloadable private GitHub prerelease
        # Some private-repo integration tokens have read-only release
        # permissions despite job-level contents: write. Compilation and
        # the downloadable Actions artifact are still valid in that case.
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -lt 8) {
            throw 'Could not resolve exact built commit.'
          }
          $tag = 'windows-test-' + $sha.Substring(0, 8)
          $zip = @(Get-ChildItem -LiteralPath '.local-windows-build/releases' -Filter 'EReader-Windows-x64-*.zip' -File)
          if ($zip.Count -ne 1) {
            throw 'Expected exactly one compiled Windows portable ZIP.'
          }
          $notes = @'
          Unsigned EReader Windows x64 portable build for private user testing.

          Unzip the whole archive and start ereader.exe; keep the DLLs and
          data folder with it. No installer or code signing is provided.
          No automated unit/GUI tests or on-device audio tests were run in
          this workflow. Start with local/free voices; keep API keys private.
          See docs/WINDOWS_USER_TEST_CHECKLIST.md for manual acceptance.
          '@
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip[0].FullName --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $zip[0].FullName --repo "${{ github.repository }}" --target $sha --prerelease --title "EReader Windows beta $($sha.Substring(0, 8))" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to publish GitHub prerelease ZIP.'
          }
