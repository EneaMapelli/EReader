name: EReader manual cross-platform verification

# Manual only: no push, pull_request, schedule, or other implicit triggers.
# Audio scope runs focused Flutter host tests on Windows and Ubuntu without
# a native build. Full scope retains both platform builds.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch or commit to test (do not merge unverified code)'
        required: true
        default: feature/m0-flutter-foundation
        type: string
      scope:
        description: 'Audio regression tests only, or complete test/build verification'
        required: true
        default: audio
        type: choice
        options:
          - audio
          - full

permissions:
  contents: read

concurrency:
  group: ereader-manual-verify
  cancel-in-progress: false

jobs:
  android:
    name: Linux/Android-host Flutter checks and optional APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name ereader --org com.example.ereader --platforms=android .
      - name: Apply tracked Android manifest and share receiver
        run: |
          cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/ereader/ereader
          cp tool/android/MainActivity.kt android/app/src/main/kotlin/com/example/ereader/ereader/MainActivity.kt
          grep -q 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -q 'class MainActivity : AudioServiceActivity()' android/app/src/main/kotlin/com/example/ereader/ereader/MainActivity.kt
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' android/app/src/main/AndroidManifest.xml
          grep -q 'com.ryanheise.audioservice.MediaButtonReceiver' android/app/src/main/AndroidManifest.xml
      - name: Report exact checked-out SHA
        run: git rev-parse HEAD
      - name: Resolve dependencies
        run: flutter pub get
      - name: Assert application/test sources still match the selected commit
        run: git diff --exit-code -- lib test
      - name: Non-mutating format report (known style backlog is advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Focused Android-host audio regression tests
        if: ${{ inputs.scope != 'full' }}
        run: flutter test --reporter expanded --concurrency=1 --timeout=2m test/audio/native_stop_timeout_test.dart test/audio/reader_media_handler_test.dart test/audio/narration_recovery_binding_test.dart test/audio/rapid_playback_navigation_test.dart test/audio/segment_completion_barrier_test.dart
      - name: Full Flutter unit suite
        if: ${{ inputs.scope == 'full' }}
        run: flutter test --reporter expanded
      - name: Static analysis (also after a test failure)
        if: ${{ !cancelled() }}
        run: flutter analyze
      - name: Build Android APK
        if: ${{ inputs.scope == 'full' }}
        run: flutter build apk --debug
      - name: Collect Android APK
        if: ${{ inputs.scope == 'full' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ereader-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  windows:
    name: Windows Flutter checks and optional desktop build
    # Match the user-release compiler; MSVC 14.51 on windows-latest
    # currently rejects just_audio_windows' experimental coroutine header.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Windows project
        run: flutter create --project-name ereader --org com.example.ereader --platforms=windows .
      - name: Report exact checked-out SHA
        run: git rev-parse HEAD
      - name: Resolve dependencies
        run: flutter pub get
      - name: Assert application/test sources still match the selected commit
        run: git diff --exit-code -- lib test
      - name: Non-mutating format report (known style backlog is advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Focused Windows-host audio regression tests
        if: ${{ inputs.scope != 'full' }}
        run: flutter test --reporter expanded --concurrency=1 --timeout=2m test/audio/native_stop_timeout_test.dart test/audio/reader_media_handler_test.dart test/audio/narration_recovery_binding_test.dart test/audio/rapid_playback_navigation_test.dart test/audio/segment_completion_barrier_test.dart
      - name: Full Flutter unit suite
        if: ${{ inputs.scope == 'full' }}
        run: flutter test --reporter expanded
      - name: Static analysis (also after a test failure)
        if: ${{ !cancelled() }}
        run: flutter analyze
      - name: Build Windows desktop
        if: ${{ inputs.scope == 'full' }}
        run: flutter build windows --debug
      - name: Collect Windows build
        if: ${{ inputs.scope == 'full' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ereader-windows-debug
          path: build/windows/x64/runner/Debug/
          retention-days: 7
