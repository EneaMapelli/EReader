name: EReader manual cross-platform verification

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch or commit to test (do not merge unverified code)'
        required: true
        default: feature/m0-flutter-foundation
        type: string

permissions:
  contents: read

concurrency:
  group: ereader-manual-verify
  cancel-in-progress: false

jobs:
  android:
    name: Android build + Dart tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name ereader --org com.example.ereader --platforms=android .
      - name: Apply tracked Android media-service manifest
        run: |
          cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          grep -q 'com.ryanheise.audioservice.AudioServiceActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' android/app/src/main/AndroidManifest.xml
          grep -q 'com.ryanheise.audioservice.MediaButtonReceiver' android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format for analysis (non-mutating to repository)
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Collect Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ereader-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  windows:
    name: Windows build + Dart tests
    # Match the user-release compiler; MSVC 14.51 on windows-latest
    # currently rejects just_audio_windows' experimental coroutine header.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Windows project
        run: flutter create --project-name ereader --org com.example.ereader --platforms=windows .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format for analysis (non-mutating to repository)
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build Windows desktop
        run: flutter build windows --debug
      - name: Collect Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ereader-windows-debug
          path: build/windows/x64/runner/Debug/
          retention-days: 7
