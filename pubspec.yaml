name: ereader
description: Offline-first cross-platform ebook reader with pluggable speech engines.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  scrollable_positioned_list: ^0.3.8
  path: ^1.9.1
  crypto: ^3.0.6
  sqlite3: ^3.7.1
  archive: ^4.5.2
  xml: ^7.1.0
  html: ^0.15.7
  pdfrx: '>=2.4.8 <2.5.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
