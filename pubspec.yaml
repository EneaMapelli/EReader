name: ereader
description: Offline-first cross-platform ebook reader with pluggable speech engines.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  # Windows Explorer drag & drop (Flutter 3.47.7+ API, no auto-download).
  desktop_drop: 0.9.2
  flutter_tts: ^4.2.5
  # Pinned until Windows/Android FFI integration smoke tests are green.
  sherpa_onnx: 1.13.8
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  just_audio_windows: ^0.2.3
  path_provider: ^2.1.6
  scrollable_positioned_list: ^0.3.8
  path: ^1.9.1
  crypto: ^3.0.6
  sqlite3: ^3.7.1
  archive: ^4.5.2
  xml: ^7.1.0
  html: ^0.15.7
  pdfrx: '>=2.4.8 <2.5.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
